version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: jobsapi_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - jobsapi-network

  # 2. Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: jobsapi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - jobsapi-network

  # 3. Backend REST API Server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobsapi_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/jobsapi
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=production_jwt_secret_change_in_real_deployment
      - ADMIN_API_KEY=admin_secret_key_12345
    depends_on:
      - mongodb
      - redis
    volumes:
      - upload-data:/usr/src/app/uploads
    networks:
      - jobsapi-network

  # 4. Asynchronous Automation Worker (BullMQ + Playwright)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobsapi_worker
    restart: unless-stopped
    command: ["node", "src/automation/workers/AutomationWorkerProcessor.js"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/jobsapi
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROWSER_POOL_SIZE=5
      - PLAYWRIGHT_HEADLESS=true
      - AUTOMATION_CONCURRENCY=3
    depends_on:
      - mongodb
      - redis
    volumes:
      - upload-data:/usr/src/app/uploads
    networks:
      - jobsapi-network

  # 5. JobsAPI Frontend Single Page Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobsapi_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - jobsapi-network

  # 6. Dice Automation Backend (Python / FastAPI / Playwright)
  dice-backend:
    build:
      context: ./dice-automation-backend
      dockerfile: Dockerfile
    container_name: jobsapi_dice_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=dice_automation
      - BROWSER_MODE=server
      - HEADLESS=true
      - BROWSER_DATA_DIR=/app/data/browser_profiles
      - CORS_ORIGINS=*
    depends_on:
      - mongodb
    volumes:
      - dice-data:/app/data
      - dice-resumes:/app/resumes
    networks:
      - jobsapi-network

  # 7. Dice Automation Frontend (React / TypeScript / Vite / Nginx)
  dice-frontend:
    build:
      context: ./dice-automation-frontend
      dockerfile: Dockerfile
    container_name: jobsapi_dice_frontend
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - dice-backend
    networks:
      - jobsapi-network

networks:
  jobsapi-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  upload-data:
  dice-data:
  dice-resumes:
